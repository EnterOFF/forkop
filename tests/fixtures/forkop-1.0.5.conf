config settings 'settings'
        option config_version '1.0.5'
        list applied_migrations 'interface_sections'
        list applied_migrations 'enable_component_checks'
        list applied_migrations 'http_connection_urls'
        option dns_type 'udp'
        list dns_server '77.88.8.8'
        list bootstrap_dns_server '77.88.8.8'
        option dns_check_interval '10s'
        option dns_recovery_check_interval '60s'
        option dns_check_timeout '2s'
        option dns_rewrite_ttl '60'
        option dns_strategy 'prefer_ipv4'
        option dns_detour_enabled '0'
        list source_network_interfaces 'br-lan'
        option enable_output_network_interface '0'
        option enable_badwan_interface_monitoring '0'
        option enable_yacd '0'
        option disable_quic '0'
        option list_update_enabled '1'
        option update_interval '1d'
        option component_update_check_enabled '1'
        option component_update_check_interval '1d'
        option latency_test_url 'https://www.gstatic.com/generate_204'
        option download_lists_via_proxy '0'
        option download_components_via_proxy '0'
        option dont_touch_dhcp '0'
        option config_path '/etc/sing-box/config.json'
        option cache_path '/tmp/sing-box/cache.db'
        option log_level 'warn'
        option exclude_ntp '0'
        option shutdown_correctly '0'

config section 'subscription_example'
        option label 'Subscription'
        option enabled '1'
        option action 'connection'
        list selector_proxy_links 'vless://3f2b8c1e-6a4d-4e2b-9f1a-7c5d8e9f0a1b@203.0.113.10:443?security=reality&sni=www.microsoft.com&pbk=SSw7I859PPdN4DQ7fxV9fobXM61Ms3mqZRlIY1aJvHQ&sid=5a&fp=chrome#Manual'
        list community_lists 'russia_inside'
        list rule_set 'https://example.com/rules.srs'
        list rule_set_with_subnets 'https://example.com/rules-with-subnets.json'
        option dashboard_filter_mode 'disabled'
        option dashboard_detect_server_country 'flag_emoji'
        option outbound_detour_enabled '0'
        option sort_by_latency '0'

config section_interface
        option section 'subscription_example'
        option name 'awg0'
        option domain_resolver_enabled '0'
        option domain_resolver_dns_type 'udp'
        option domain_resolver_dns_server '8.8.8.8'

config subscription_url
        option section 'subscription_example'
        option url 'https://example.com/api/sub'
        option auto_user_agent '0'
        option user_agent 'CustomAgent/1.0'
        option auto_hwid '1'
        option subscription_update_enabled '1'
        option subscription_update_interval '1h'
        option download_via_proxy_enabled '0'
        option show_dashboard_metadata '1'
        option prefix_nodes '0'
        option include_urltest_groups '1'
        option hide_urltest_group_outbounds '1'
        option hide_detour_outbounds '1'

config urltest
        option section 'subscription_example'
        option name 'Fastest'
        option check_interval '3m'
        option tolerance '50'
        option testing_url 'https://www.gstatic.com/generate_204'
        option idle_timeout '30m'
        option interrupt_exist_connections '1'
        option pin_dashboard '1'
        option filter_mode 'disabled'
        option detect_server_country 'flag_emoji'
        list exclude_countries 'US'
        list include_countries 'NL'

config section 'json_outbound_example'
        option label 'JSON outbound'
        option enabled '1'
        option action 'connection'
        list outbound_jsons '{"type":"socks","tag":"Local SOCKS","server":"127.0.0.1","server_port":1080,"version":"5"}'
        list community_lists 'telegram'

config server 'server_json_inbound_example'
        option label 'JSON inbound'
        option enabled '1'
        option protocol 'json_inbound'
        option routing_mode 'rules'
        option inbound_json '{"type":"mixed","listen":"0.0.0.0","listen_port":1080}'

config server 'server_vless_reality_example'
        option label 'VLESS Reality server'
        option enabled '1'
        option protocol 'vless'
        option listen '0.0.0.0'
        option listen_port '443'
        option public_host 'vpn.example.com'
        option routing_mode 'rules'
        option security 'reality'
        option server_uuid '8d2c5f3a-1b4e-4c6d-8e9f-0a1b2c3d4e5f'
        option vless_flow 'none'
        option tls_server_name 'www.microsoft.com'
        option client_fingerprint 'chrome'
        option reality_handshake_server 'www.microsoft.com'
        option reality_handshake_server_port '443'
        option reality_private_key 'kP1C4vzQnlzyKRo3DORq6f_v3n9u7nGY8dl0AKbx11A'
        option reality_public_key 'SSw7I859PPdN4DQ7fxV9fobXM61Ms3mqZRlIY1aJvHQ'
        option reality_short_id '5a'
        option reality_max_time_difference '1m'
        option transport 'tcp'

config server 'server_mtproto_example'
        option label 'MTProto proxy'
        option enabled '1'
        option protocol 'mtproto'
        option listen '0.0.0.0'
        option listen_port '8443'
        option public_host 'vpn.example.com'
        option routing_mode 'rules'
        option mtproto_secret '11111111111111111111111111111111'
        option mtproto_faketls 'google.com'
        option mtproto_padding '1'
        option mtproto_domain_fronting_port '443'
        option mtproto_prefer_ip 'prefer-ipv4'
        option mtproto_tolerate_time_skewness '3s'
        option mtproto_idle_timeout '5m'
        option mtproto_handshake_timeout '10s'

config server 'server_tailscale_example'
        option label 'Tailscale endpoint'
        option enabled '1'
        option protocol 'tailscale'
        option routing_mode 'rules'
        option tailscale_control_url 'https://controlplane.tailscale.com'
        option tailscale_hostname 'forkop-server-tailscale-example'
        option tailscale_auth_key 'tskey-auth-kExample1CNTRL-Example2'
        option tailscale_accept_routes '0'
        option tailscale_advertise_exit_node '1'
